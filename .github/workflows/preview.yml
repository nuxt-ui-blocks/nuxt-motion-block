name: Preview Deploy

on:
  push:
    branches:
      - '**'

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci --prefix docs
      - name: Build docs
        run: npm run build --prefix docs
      - name: Install Wrangler
        run: npm i -D wrangler@latest
      - name: Deploy preview
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_PAGES_BRANCH: ${{ github.ref_name }}
        run: npm run deploy:preview --prefix docs
